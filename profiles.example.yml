banksphere:
  target: dev
  outputs:
    dev:
      type: bigquery
      method: oauth
      project: YOUR_GCP_PROJECT_ID
      dataset: banksphere_dev
      location: US
      threads: 4
      priority: interactive
      job_retries: 1
      job_execution_timeout_seconds: 300
    sit:
      type: bigquery
      method: oauth
      project: YOUR_GCP_PROJECT_ID
      dataset: banksphere_sit
      location: US
      threads: 4
      priority: interactive
    prod:
      type: bigquery
      method: oauth
      project: YOUR_GCP_PROJECT_ID
      dataset: banksphere_prod
      location: US
      threads: 4
      priority: interactive
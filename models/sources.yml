version: 2

sources:
  - name: banksphere_raw
    description: CSV source tables loaded to BigQuery without business transformations.
    database: "{{ target.database }}"
    schema: "{{ var('raw_schema', 'banksphere_raw') }}"
    tables:
      - name: branches
        description: Branch master; one row per branch.
        columns:
          - name: branch_id
            description: Stable branch business key.
            tests: [not_null, unique]
          - name: branch_name
            description: Display name of the branch.
          - name: city
            description: Branch city.
          - name: state
            description: Branch state or territory.
          - name: branch_type
            description: Operating classification of the branch.
          - name: opened_date
            description: Date the branch began operations.
          - name: region
            description: Bank operating region.
          - name: updated_at
            description: Source-system update timestamp.
      - name: customers
        description: Customer master; one row per customer.
        freshness:
          warn_after: {count: 24, period: hour}
          error_after: {count: 72, period: hour}
        loaded_at_field: updated_at
        columns:
          - name: customer_id
            description: Stable customer business key.
            tests: [not_null, unique]
          - name: customer_name
            description: Customer full name.
          - name: email
            description: Customer email address.
          - name: phone
            description: Customer phone number, retained as text.
          - name: city
            description: Customer city.
          - name: state
            description: Customer state or territory.
          - name: customer_segment
            description: Commercial segment assigned to the customer.
          - name: date_of_birth
            description: Customer date of birth.
          - name: signup_date
            description: Date the customer joined the bank.
          - name: kyc_status
            description: Know-your-customer verification status.
          - name: updated_at
            description: Source update timestamp; used as a freshness proxy because no ingestion timestamp is supplied.
      - name: accounts
        description: Account master; one row per account.
        freshness:
          warn_after: {count: 24, period: hour}
          error_after: {count: 72, period: hour}
        loaded_at_field: updated_at
        columns:
          - name: account_id
            description: Stable account business key.
            tests: [not_null, unique]
          - name: customer_id
            description: Owning customer business key.
          - name: branch_id
            description: Servicing branch business key.
          - name: account_type
            description: Product type of the account.
          - name: account_status
            description: Current account lifecycle status.
          - name: currency
            description: ISO currency code.
          - name: opening_date
            description: Account opening date.
          - name: credit_limit
            description: Approved credit limit, if applicable.
          - name: current_balance
            description: Latest source balance.
          - name: updated_at
            description: Source update timestamp and freshness proxy.
      - name: transactions
        description: Transaction source; one row per transaction event.
        freshness:
          warn_after: {count: 24, period: hour}
          error_after: {count: 72, period: hour}
        loaded_at_field: updated_at
        columns:
          - name: transaction_id
            description: Stable transaction business key.
            tests: [not_null, unique]
          - name: account_id
            description: Account associated with the transaction.
          - name: customer_id
            description: Customer recorded on the transaction event.
          - name: transaction_date
            description: Business date of the transaction.
          - name: transaction_type
            description: Transaction classification code.
          - name: channel
            description: Channel through which the event was initiated.
          - name: amount
            description: Transaction amount in the recorded currency.
          - name: currency
            description: ISO currency code.
          - name: transaction_status
            description: Processing status of the transaction.
          - name: reference_number
            description: Source reference identifier.
          - name: description
            description: Source-provided transaction description.
          - name: updated_at
            description: Source update timestamp and freshness proxy.
      - name: cards
        description: Debit and credit card source; one row per card.
        columns:
          - name: card_id
            description: Stable card business key.
            tests: [not_null, unique]
          - name: account_id
            description: Linked account business key.
          - name: customer_id
            description: Linked customer business key.
          - name: card_type
            description: Debit or credit product classification.
          - name: card_status
            description: Current card lifecycle status.
          - name: network
            description: Card payment network.
          - name: issue_date
            description: Card issue date.
          - name: expiry_date
            description: Card expiry date.
          - name: credit_limit
            description: Card credit limit, if applicable.
          - name: updated_at
            description: Source update timestamp.
      - name: loans
        description: Loan portfolio source; one row per loan.
        columns:
          - name: loan_id
            description: Stable loan business key.
            tests: [not_null, unique]
          - name: customer_id
            description: Borrower customer business key.
          - name: account_id
            description: Linked account business key.
          - name: loan_type
            description: Product classification for the loan.
          - name: loan_status
            description: Current loan lifecycle status.
          - name: application_date
            description: Loan application date.
          - name: sanctioned_amount
            description: Amount approved by the bank.
          - name: interest_rate
            description: Annual interest rate as a percentage.
          - name: tenure_months
            description: Contracted loan term in months.
          - name: outstanding_amount
            description: Current principal outstanding in the source.
          - name: updated_at
            description: Source update timestamp.
      - name: loan_payments
        description: Loan repayment source; one row per payment event.
        columns:
          - name: payment_id
            description: Stable payment business key.
            tests: [not_null, unique]
          - name: loan_id
            description: Related loan business key.
          - name: payment_date
            description: Payment business date.
          - name: payment_amount
            description: Total amount recorded for the payment.
          - name: principal_amount
            description: Principal component recorded for the payment.
          - name: interest_amount
            description: Interest component recorded for the payment.
          - name: payment_status
            description: Processing outcome of the payment.
          - name: payment_channel
            description: Channel used for repayment.
          - name: updated_at
            description: Source update timestamp.